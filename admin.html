<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<meta content="#080b13" name="theme-color"/>
<title>0PTICBOX Admin Sign In</title>
<link href="styles.css?v=23" rel="stylesheet"/>



<link rel="preconnect" href="https://db.onlinewebfonts.com" crossorigin>
<link rel="stylesheet" href="alsina-profile-fix-v20.css">
</head>
<body class="admin-page admin-login-page">
<canvas aria-hidden="true" id="page-particles"></canvas>
<header class="topbar">
<div class="shell topbar-inner">
<a class="wordmark" href="index.html" aria-label="0PTICBOX Productions home"><img class="wordmark-logo-gif" src="assets/opticbox-spinning-logo.webp" alt="0PTICBOX Productions spinning logo"/></a>
<nav aria-label="Admin navigation" class="site-nav admin-nav">
<a href="index.html">View site</a>
<a href="messages.html">Messages</a><a href="profile-settings.html">Settings</a></nav>
</div>
</header>
<main class="shell admin-login-shell">
<section class="box admin-intro">
<div class="box-title split-title"><span>0PTICBOX Admin</span><small>private access</small></div>
<div class="admin-intro-body">
<p>Sign in with the owner account to open the private dashboard.</p>
<p class="admin-warning" hidden="" id="config-warning">This copy is not connected yet. Complete <strong>ADMIN-SETUP.md</strong> and update <strong>supabase-config.js</strong>.</p>
</div>
</section>
<section aria-labelledby="login-title" class="box admin-login" id="login-panel">
<h1 class="box-title" id="login-title">Admin sign in</h1>
<form class="admin-form" id="login-form">
<label for="admin-email">Email</label>
<input autocomplete="username" id="admin-email" name="email" required="" type="email"/>
<label for="admin-password">Password</label>
<input autocomplete="current-password" id="admin-password" name="password" required="" type="password"/>
<button class="retro-button primary" type="submit">Sign in</button>
<p aria-live="polite" class="admin-message" id="login-message"></p>
</form>
</section>
</main>
<script src="site.js?v=20"></script>
<script src="admin.js" type="module"></script>
</body>
</html>
