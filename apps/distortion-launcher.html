<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  <title>DISTORTION — 0PTICBOX</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;color:#edf4f6;font-family:Arial,sans-serif}.launchbar{height:58px;display:flex;align-items:center;gap:10px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-bottom:1px solid #344047;background:#0d1215;position:relative;z-index:2}.launchbar strong{letter-spacing:.08em}.launchbar .hint{min-width:0;flex:1;color:#aebac0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.launchbar button{border:1px solid #00ef9a;background:#09271e;color:#fff;font:700 12px/1 Arial,sans-serif;padding:11px 14px;cursor:pointer}.launchbar button:hover{background:#0b3a2a}.status{font-size:11px;color:#00ef9a;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}iframe{display:block;width:100%;height:calc(100% - 58px);border:0;background:#090b0d}@media(max-width:700px){.launchbar{height:auto;min-height:58px;flex-wrap:wrap}.launchbar .hint{order:3;flex-basis:100%;white-space:normal}.status{max-width:40vw}iframe{height:calc(100% - 82px)}}
  </style>
<!-- 0PTICBOX adaptive app performance v1 -->
<script src="app-performance.js?v=20260816-1"></script>
</head>
<body>
  <div class="launchbar">
    <strong>DISTORTION</strong>
    <span class="hint">Start here: load WAV, MP3, M4A, AAC, AIF or AIFF. The app will tell you if this browser cannot decode the file.</span>
    <button id="loadAudio" type="button">LOAD AUDIO</button>
    <span class="status" id="compatStatus">READY</span>
  </div>
  <iframe id="app" src="distortion/index.html?v=20260815-1" title="DISTORTION live video remix studio" allow="fullscreen; autoplay"></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('app');
    const status=document.getElementById('compatStatus');
    const loadButton=document.getElementById('loadAudio');
    const setStatus=(text,error=false)=>{status.textContent=text;status.style.color=error?'#ff7272':'#00ef9a';};

    frame.addEventListener('load',()=>{
      let doc,win;
      try{doc=frame.contentDocument;win=frame.contentWindow;}catch{setStatus('APP ACCESS BLOCKED',true);return;}
      const input=doc.getElementById('audioInput');
      const song=doc.getElementById('song');
      const audioName=doc.getElementById('audioName');
      const mediaPanel=doc.querySelector('.media-panel section');
      if(!input||!song){setStatus('AUDIO CONTROL NOT FOUND',true);return;}

      input.accept='.wav,.wave,.mp3,.m4a,.aac,.aif,.aiff,.caf,.flac,.ogg,.opus,audio/*';
      input.setAttribute('aria-label','Load an audio file — WAV, MP3, M4A, AAC, AIF, AIFF, CAF, FLAC, OGG or OPUS');

      if(mediaPanel&&!doc.getElementById('opticboxAudioGuide')){
        const guide=doc.createElement('div');
        guide.id='opticboxAudioGuide';
        guide.innerHTML='<strong>1. LOAD YOUR MUSIC HERE</strong><span>WAV · MP3 · M4A · AAC · AIF · AIFF</span>';
        guide.style.cssText='border:1px solid #00ef9a;background:#09271e;color:#fff;padding:10px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;letter-spacing:.04em';
        mediaPanel.insertBefore(guide,mediaPanel.children[1]||null);
      }

      input.addEventListener('change',()=>{
        const file=input.files&&input.files[0];
        if(!file)return;
        setStatus('CHECKING '+file.name);
        if(audioName)audioName.textContent='CHECKING — '+file.name;
      });

      song.addEventListener('loadedmetadata',()=>{
        const file=input.files&&input.files[0];
        const name=file?file.name:'AUDIO';
        setStatus('READY — '+name);
        if(audioName)audioName.textContent='READY — '+name;
      });

      song.addEventListener('canplay',()=>{
        const file=input.files&&input.files[0];
        if(file)setStatus('READY — '+file.name);
      });

      song.addEventListener('error',()=>{
        const file=input.files&&input.files[0];
        const name=file?file.name:'THIS FILE';
        setStatus('BROWSER CANNOT DECODE '+name,true);
        if(audioName)audioName.textContent='COULD NOT PLAY — '+name;
        const appStatus=doc.getElementById('statusText');
        if(appStatus)appStatus.textContent='AUDIO FORMAT NOT PLAYABLE IN THIS BROWSER — TRY WAV/MP3 OR A DIFFERENT BROWSER';
      });

      loadButton.onclick=()=>input.click();
      setStatus('READY — LOAD AUDIO');
    });
  })();
  </script>
</body>
</html>
