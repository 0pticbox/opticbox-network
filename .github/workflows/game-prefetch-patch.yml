name: One-time PICO loading optimization integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/game-prefetch-patch.yml'

permissions:
  contents: write

jobs:
  integrate-game-prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add idle cartridge warm-up
        shell: python
        run: |
          from pathlib import Path

          marker = '<!-- 0PTICBOX PICO load smoother v1 -->'
          targets = {
              'games/orbital-repair/index.html': 'orbital_repair.js',
              'games/inner-light-runner/index.html': 'inner_light_runner_opticbox_productions.js',
          }

          for filename, cart in targets.items():
              path = Path(filename)
              html = path.read_text(encoding='utf-8-sig')
              if marker in html or 'game-load-performance.js' in html:
                  print(f'ALREADY PATCHED: {filename}')
                  continue
              pos = html.lower().find('</head>')
              if pos < 0:
                  raise RuntimeError(f'No </head> found in {filename}')
              injection = (
                  f'{marker}\n'
                  f'<script src="../game-load-performance.js?v=20260816-1" data-cart="{cart}"></script>\n'
              )
              html = html[:pos] + injection + html[pos:]
              path.write_text(html, encoding='utf-8')
              print(f'PATCHED: {filename}')

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "0PTICBOX Performance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add games/orbital-repair/index.html games/inner-light-runner/index.html
          git commit -m "Warm PICO cartridge files during idle time"
          git push origin HEAD:main
