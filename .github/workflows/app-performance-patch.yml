name: One-time browser tool performance integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-performance-patch.yml'

permissions:
  contents: write

jobs:
  integrate-performance-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add performance controller before tool code
        shell: python
        run: |
          from pathlib import Path

          marker = '<!-- 0PTICBOX adaptive app performance v1 -->'
          targets = {
              'apps/opticscope/index.html': '../app-performance.js?v=20260816-1',
              'apps/spectravault/index.html': '../app-performance.js?v=20260816-1',
              'apps/pixel-visualizer/index.html': '../app-performance.js?v=20260816-1',
              'apps/distortion/index.html': '../app-performance.js?v=20260816-1',
              'apps/distortion-launcher.html': 'app-performance.js?v=20260816-1',
              'apps/dj-visual-studio/index.html': '../app-performance.js?v=20260816-1',
              'apps/dj-visual-studio/OPEN-ME.html': '../app-performance.js?v=20260816-1',
              'apps/dj-visual-studio/source/index-source.html': '../../app-performance.js?v=20260816-1',
              'apps/boxed-arp-v47/index.html': '../app-performance.js?v=20260816-1',
          }

          changed = []
          for filename, src in targets.items():
              path = Path(filename)
              if not path.exists():
                  print(f'SKIP missing: {filename}')
                  continue
              html = path.read_text(encoding='utf-8')
              if marker in html or 'app-performance.js' in html:
                  print(f'ALREADY PATCHED: {filename}')
                  continue
              lower = html.lower()
              pos = lower.find('</head>')
              if pos < 0:
                  raise RuntimeError(f'No </head> found in {filename}')
              injection = f'{marker}\n<script src="{src}"></script>\n'
              html = html[:pos] + injection + html[pos:]
              path.write_text(html, encoding='utf-8')
              changed.append(filename)
              print(f'PATCHED: {filename}')

          print(f'Patched {len(changed)} browser-tool entry points.')

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "0PTICBOX Performance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/opticscope/index.html \
                  apps/spectravault/index.html \
                  apps/pixel-visualizer/index.html \
                  apps/distortion/index.html \
                  apps/distortion-launcher.html \
                  apps/dj-visual-studio/index.html \
                  apps/dj-visual-studio/OPEN-ME.html \
                  apps/dj-visual-studio/source/index-source.html \
                  apps/boxed-arp-v47/index.html
          git commit -m "Apply adaptive performance controller to browser tools"
          git push origin HEAD:main
